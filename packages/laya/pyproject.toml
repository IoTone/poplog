[project]
name = "poplog-laya"
version = "0.1.0"
description = "The Python half of Poplog's LIB LAYA: serves laya-mlx typed decisions to Pop-11"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Upstream, unmodified: https://github.com/mizorewww/laya-mlx (PyPI 0.2.0 is main @ 0a85951)
    "laya-mlx==0.2.0",
    # Exact, not laya-mlx's range: the mlx-c shims in experiments/mlx_shim are built against
    # this MLX, and results are only reproducible on one version.
    "mlx==0.32.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.uv]
# Not a distributable package: laya_serve.py is run in place by LIB LAYA via `uv run`.
package = false
# MLX runs on Apple Silicon only.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
