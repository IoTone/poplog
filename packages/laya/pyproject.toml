[project]
name = "poplog-laya"
version = "0.1.0"
description = "The Python half of Poplog's LIB LAYA: serves laya-mlx typed decisions to Pop-11"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Upstream, unmodified: https://github.com/mizorewww/laya-mlx (PyPI 0.9.1 is tag v0.9.1 @ e00fbf2)
    "laya-mlx==0.9.1",
    # Exact, not laya-mlx's range: results are only reproducible on one version.  (The E4/E5
    # mlx-c shims in experiments/mlx_shim were built against 0.32.2; see RESEARCH.md.)
    "mlx==0.32.5",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.uv]
# Not a distributable package: laya_serve.py is run in place by LIB LAYA via `uv run`.
package = false
# MLX runs on Apple Silicon only.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
