# Hunt the intermittent process-wait hang on hosted runners.
#
# Manual only.  This builds nothing for release and publishes nothing; it
# exists because the hang reproduces on GitHub runners and nowhere we can
# attach a debugger by hand.
#
# Background.  skill-release.yml runs all 16 library suites on hosted
# runners for the first time (the Jenkins gate ran 2).  Three of nine
# platform legs hung: test_http_server twice on macOS arm64,
# test_sysexecute_or_exit once on x86_64 Linux.  Each had passed its
# visible checks and then parked waiting for a child process.  23 local
# runs, loaded and unloaded, were clean.
#
# Both failing suites keep a SECOND child alive while waiting on the
# first, so the leading hypothesis is sys_wait bookkeeping rather than a
# lost wake-up: pop/src/syswait.p loops `returnif(is_dead(pid));
# syshibernate()`, and a pid whose exit status was already consumed by
# another waiter can never satisfy is_dead -- which the 100ms bound from
# #47 cannot rescue, since nothing is waiting to be woken.
#
# tools/debug/forkwait-probe.sh dumps the process tree, the signal masks
# and the fd list BEFORE killing anything, which is what test-libs.sh's
# watchdog destroys.  Read the STAT column of the dump first: a Z or
# <defunct> child confirms the hypothesis; an S/R child refutes it and
# moves the bug into the child.
name: forkwait-probe

on:
  # workflow_dispatch is only offered for workflows on the default branch,
  # and this one has to run before it is merged anywhere -- so pushing the
  # probe branch is a trigger too.  Narrow on purpose: no other branch
  # starts a 45-minute three-platform hunt by accident.
  push:
    branches: [forkwait-probe]
  workflow_dispatch:
    inputs:
      rounds:
        description: 'Rounds per round-trip. Whole-set rounds take ~2min each; 1-in-3 hang rate means ~15 is plenty'
        default: '15'
      whole_set:
        description: 'Run the full 16-suite test-libs.sh sequence (the configuration that actually hangs)'
        type: boolean
        default: true
      suites:
        description: 'Suites to loop, space separated; empty means the two that hung'
        required: false
      patience:
        description: 'Seconds of no exit before a round is called a hang'
        default: '75'

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            seed: corepop-x86_64-linux
          - runner: ubuntu-24.04-arm
            seed: corepop-aarch64-linux
          - runner: macos-latest
            seed: corepop-aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # gdb is for the probe's backtrace, not the build.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev libcurl4-openssl-dev libpcre2-dev gdb
          # Attaching to a non-child needs this relaxed on Ubuntu.
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew list pcre2 >/dev/null 2>&1 || brew install pcre2

      - name: Seed target/pop/corepop
        run: |
          mkdir -p target/pop
          cp "nix/seeds/${{ matrix.seed }}" target/pop/corepop
          chmod 755 target/pop/corepop

      - name: Build Poplog
        run: |
          ./configure
          make

      - name: Build the optional C shims
        run: |
          sh tools/build-popcurl.sh
          sh tools/build-poppcre.sh

      # Exits 1 on the first hang, having dumped the state. A clean run
      # is also a result: it bounds how rare the hang is on this platform.
      # Isolated suites came back clean: 240 runs, 40 rounds x 2 suites x 3
      # platforms, no hang.  So --set is the default -- the hang needs the
      # whole sequence, not the suite.
      - name: Probe
        timeout-minutes: 90
        env:
          # A push trigger carries no inputs at all, so every one of these
          # needs its own fallback -- an empty rounds count would otherwise
          # make the probe exit 2 on arrival.
          PROBE_PATIENCE: ${{ inputs.patience || '75' }}
          # One round on a push, deliberately.  The 45-round runs were a
          # misread: only round 1 of each is on a freshly booted runner
          # with a cold tree, so 15 rounds bought 1 cold sample and 14 warm
          # ones -- and all three hangs seen so far were a runner's FIRST
          # test-libs run.  At the observed ~25% per-leg rate, three cold
          # samples come back clean 42% of the time, so the earlier "all
          # clean" never tested this.  One round per push, pushed a few
          # times, is how to get cold samples.
          ROUNDS: ${{ inputs.rounds || '1' }}
          SET_FLAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.whole_set == false) && ' ' || '--set' }}
        run: |
          # shellcheck disable=SC2086
          sh tools/debug/forkwait-probe.sh $SET_FLAG $ROUNDS ${{ inputs.suites }} \
              2>&1 | tee probe.log

      - name: Keep the dump even when the probe fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.runner }}
          path: probe.log
          if-no-files-found: warn
