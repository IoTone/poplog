# Fail any push or pull request that adds a path Windows cannot check
# out: a forbidden character, a reserved name, a case-only collision or
# a symbolic link.  A file named hash_< stopped every clone on Windows
# until 2026 (issue #18).  Seconds to run; needs no build.
name: portable-paths

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/ci/check-portable-paths.py
